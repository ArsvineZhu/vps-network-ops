[project]
name = "vps-network-ops"
version = "0.1.0"
description = "Personal VPS network operations"
license = "MIT AND GPL-2.0-only AND GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=41",
    "PyYAML>=6.0.3,<7",
]

[dependency-groups]
tcp-rtt = ["dpkt==1.9.8"]
dev = [
  "basedpyright>=1.40.2,<2",
  "pytest>=9.2,<10",
  "ruff>=0.17.5,<1",
  "types-PyYAML>=6.0.12.20261113,<7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
vps-ops = "vps_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "temp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["system/tcpfp", "src", "tests"]
extraPaths = ["system/tcpfp", "src"]
exclude = ["build", "temp", ".venv", "node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["system/tcpfp", "src"]
addopts = "-ra"

[tool.setuptools.package-data]
"vps_ops.deploy" = ["*.yaml", "*.sh", "assets/**/*"]
