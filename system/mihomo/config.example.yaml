mode: rule
log-level: warning
ipv6: false
allow-lan: false
find-process-mode: "off"
tun:
  enable: false
external-controller-unix: /var/lib/mihomo/controller/control.sock
dns:
  enable: true
  ipv6: false
  nameserver:
    - 1.1.1.1
listeners:
  - name: vless-in
    type: vless
    listen: 0.0.0.0
    port: 8443
    users:
      - username: windows-test
        uuid: REPLACE_WITH_WINDOWS_UUID
        flow: xtls-rprx-vision
      - username: ios-test
        uuid: REPLACE_WITH_IOS_UUID
        flow: xtls-rprx-vision
    reality-config:
      dest: REPLACE_WITH_REALITY_TARGET:443
      server-names: [REPLACE_WITH_REALITY_HOSTNAME]
      private-key: REPLACE_WITH_REALITY_PRIVATE_KEY
      short-id: [REPLACE_WITH_SHORT_ID]
  - name: hysteria2-in
    type: hysteria2
    listen: 0.0.0.0
    port: 8443
    certificate: /run/credentials/mihomo.service/tls-fullchain.pem
    private-key: /run/credentials/mihomo.service/tls-key.pem
    users:
      windows-test: REPLACE_WITH_WINDOWS_HYSTERIA2_PASSWORD
      ios-test: REPLACE_WITH_IOS_HYSTERIA2_PASSWORD
    ignore-client-bandwidth: true
  - name: anytls-in
    type: anytls
    listen: 0.0.0.0
    port: 9444
    certificate: /run/credentials/mihomo.service/tls-fullchain.pem
    private-key: /run/credentials/mihomo.service/tls-key.pem
    users:
      windows-test: REPLACE_WITH_WINDOWS_ANYTLS_PASSWORD
      ios-test: REPLACE_WITH_IOS_ANYTLS_PASSWORD
proxies:
  - name: TCPFP-Windows
    type: socks5
    server: 10.203.1.2
    port: 1080
    username: windows
    password: REPLACE_WITH_WINDOWS_BACKEND_PASSWORD
    udp: false
  - name: TCPFP-iOS
    type: socks5
    server: 10.203.2.2
    port: 1080
    username: ios
    password: REPLACE_WITH_IOS_BACKEND_PASSWORD
    udp: false
rules:
  - AND,((DOMAIN,REPLACE_WITH_SUBSCRIPTION_DOMAIN),(DST-PORT,9443),(NETWORK,TCP)),DIRECT
  - AND,((IP-CIDR,REPLACE_WITH_PUBLIC_IPV4/32,no-resolve),(DST-PORT,9443),(NETWORK,TCP)),DIRECT
  - IP-CIDR,0.0.0.0/8,REJECT
  - IP-CIDR,10.0.0.0/8,REJECT
  - IP-CIDR,100.64.0.0/10,REJECT
  - IP-CIDR,127.0.0.0/8,REJECT
  - IP-CIDR,169.254.0.0/16,REJECT
  - IP-CIDR,172.16.0.0/12,REJECT
  - IP-CIDR,192.0.0.0/24,REJECT
  - IP-CIDR,192.0.2.0/24,REJECT
  - IP-CIDR,REPLACE_WITH_PUBLIC_IPV4/32,REJECT
  - IP-CIDR,192.88.99.0/24,REJECT
  - IP-CIDR,192.168.0.0/16,REJECT
  - IP-CIDR,198.18.0.0/15,REJECT
  - IP-CIDR,198.51.100.0/24,REJECT
  - IP-CIDR,203.0.113.0/24,REJECT
  - IP-CIDR,224.0.0.0/4,REJECT
  - IP-CIDR,240.0.0.0/4,REJECT
  - IP-CIDR6,::/0,REJECT
  - AND,((IN-USER,windows-test),(NETWORK,UDP)),DIRECT
  - IN-USER,windows-test,TCPFP-Windows
  - AND,((IN-USER,ios-test),(NETWORK,UDP)),DIRECT
  - IN-USER,ios-test,TCPFP-iOS
  - MATCH,DIRECT
