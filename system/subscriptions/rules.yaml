rules:
  - "AND,((IP-CIDR,${server_ipv4}/32,no-resolve),(DST-PORT,${ssh_port}),(NETWORK,TCP)),DIRECT"
  - "AND,((IP-CIDR,${server_ipv4}/32,no-resolve),(DST-PORT,${subscription_port}),(NETWORK,TCP)),DIRECT"
  - "AND,((NETWORK,TCP),(RULE-SET,openai-custom)),OpenAI"
  - "RULE-SET,ads,REJECT"
  - "RULE-SET,anthropic,Anthropic"
  - "NETWORK,udp,节点"
  - "NETWORK,udp,REJECT"
  - "RULE-SET,openai,OpenAI"
  - "RULE-SET,google-ai,Google AI"
  - "RULE-SET,cursor,AI-Coding"
  - "RULE-SET,copilot,AI-Coding"
