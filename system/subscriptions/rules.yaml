# 服务端订阅地址；将域名改为自己的订阅域名。
base-url: https://subscription.example.com:9443
node-group: 节点
variables:
  server_ipv4: 203.0.113.1
  ssh_port: 23899
hosts:
  ${subscription_host}: ${server_ipv4}

defaults:
  domain-mrs: &domain-mrs
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: DIRECT
  ip-mrs: &ip-mrs
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: DIRECT
  classical-yaml: &classical-yaml
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: DIRECT
  classical-text: &classical-text
    type: http
    behavior: classical
    format: text
    interval: 86400
    proxy: DIRECT
  domain-yaml: &domain-yaml
    type: http
    behavior: domain
    format: yaml
    interval: 86400
    proxy: DIRECT

proxy-groups:
  - name: GLOBAL
    type: select
    proxies: [节点, DIRECT]
  - { name: GitHub, type: select, proxies: [节点, DIRECT] }
  - { name: YouTube, type: select, proxies: [节点, DIRECT] }
  - { name: Google, type: select, proxies: [节点, DIRECT] }
  - { name: Telegram, type: select, proxies: [节点, DIRECT] }
  - { name: Netflix, type: select, proxies: [节点, DIRECT] }
  - { name: Disney, type: select, proxies: [节点, DIRECT] }
  - { name: Spotify, type: select, proxies: [节点, DIRECT] }
  - { name: Bilibili, type: select, proxies: [DIRECT, 节点] }
  - { name: China, type: select, proxies: [DIRECT, 节点] }
  - { name: Private, type: select, proxies: [节点, DIRECT] }
  - { name: OpenAI, type: select, proxies: [节点, DIRECT] }
  - name: Anthropic-直连（仅 TCP）
    type: select
    proxies: [DIRECT]
    disable-udp: true
    hidden: true
  - name: Anthropic
    type: select
    proxies: [REJECT, 节点, Anthropic-直连（仅 TCP）]
    default-selected: REJECT
  - { name: Google AI, type: select, proxies: [节点, DIRECT] }
  - { name: Grok, type: select, proxies: [节点, DIRECT] }
  - { name: AI-Coding, type: select, proxies: [节点, DIRECT] }
  - { name: AI-Other, type: select, proxies: [节点, DIRECT] }
  - { name: Steam, type: select, proxies: [节点, DIRECT] }
  - { name: 游戏, type: select, proxies: [节点, DIRECT] }
  - { name: 游戏下载, type: select, proxies: [节点, DIRECT] }
  - { name: 开发, type: select, proxies: [节点, DIRECT] }
  - { name: Apple, type: select, proxies: [节点, DIRECT] }
  - { name: Microsoft, type: select, proxies: [节点, DIRECT] }
  - { name: Linux, type: select, proxies: [节点, DIRECT] }

