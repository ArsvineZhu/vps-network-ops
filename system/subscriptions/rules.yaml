  - "RULE-SET,ai-other,AI-Other"
  - "RULE-SET,github,GitHub"
  - "RULE-SET,youtube,YouTube"
  - "RULE-SET,google,Google"
  - "RULE-SET,telegram,Telegram"
  - "RULE-SET,telegram-ip,Telegram,no-resolve"
  - "RULE-SET,netflix,Netflix"
  - "RULE-SET,disney,Disney"
  - "RULE-SET,spotify,Spotify"
  - "RULE-SET,bilibili,Bilibili"
  - "RULE-SET,game-download,游戏下载"
  - "RULE-SET,steam-cn,游戏下载"
  - "RULE-SET,steam,Steam"
  - "RULE-SET,epicgames,游戏"
  - "RULE-SET,blizzard,游戏"
  - "RULE-SET,docker,开发"
  - "RULE-SET,developer,开发"
  - "RULE-SET,apple-cn,DIRECT"
  - "RULE-SET,microsoft-cn,DIRECT"
  - "RULE-SET,apple,Apple"
  - "RULE-SET,microsoft,Microsoft"
  - "RULE-SET,linux-canonical,Linux"
  - "RULE-SET,linux-debian,Linux"
  - "RULE-SET,linux-archlinux,Linux"
  - "RULE-SET,linux-fedora,Linux"
  - "RULE-SET,private,Private"
  - "RULE-SET,loyal-proxy,节点"
  - "RULE-SET,loyal-direct,China"
  - "RULE-SET,cn,China"
