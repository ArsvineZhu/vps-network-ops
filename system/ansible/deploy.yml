---
- name: Install a reviewed VPS bundle on a fresh Ubuntu host
  hosts: vps_network
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    apply_changes: false
    expected_mihomo_sha256: 817f50b3ac6a8b1c4360c5cf2961906057f3a883d970ebbcb0028a01632b620f
  pre_tasks:
    - name: Require an explicit deployment decision before contacting the host
      ansible.builtin.assert:
        that:
          - apply_changes | bool
          - not ansible_check_mode
          - bundle_dir is defined
          - mihomo_binary is defined
        fail_msg: >-
          No changes are permitted by default. Review the generated plan, then
          supply bundle_dir, mihomo_binary and apply_changes=true for a fresh
          host. Use validate_bundle.py for offline validation; --check is not
          a substitute for a real disposable-host deployment test.

    - name: Validate private bundle paths and pinned binary on the controller
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/validate_bundle.py"
          - "{{ bundle_dir }}"
          - --mihomo-binary
          - "{{ mihomo_binary }}"
          - --json
      delegate_to: localhost
      become: false
      register: bundle_validation
      changed_when: false
      no_log: true

    - name: Retain validated metadata without logging credential-bearing paths
      ansible.builtin.set_fact:
        deployment: "{{ bundle_validation.stdout | from_json }}"
      no_log: true

    - name: Perform read-only remote compatibility and collision checks
      ansible.builtin.import_tasks: tasks/preflight.yml

  tasks:
    - name: Install and validate files before enabling services
      ansible.builtin.import_tasks: tasks/install.yml

    - name: Start validated services in their dependency order
      ansible.builtin.import_tasks: tasks/start.yml
