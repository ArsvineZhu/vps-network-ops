---
- name: Read minimum operating-system facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - min

- name: Restrict the supported deployment baseline
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version == '24.04'
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: This installer supports fresh Ubuntu 24.04 x86_64 with systemd only.

- name: Read installed service state
  ansible.builtin.service_facts:

- name: Refuse legacy or already installed proxy services
  ansible.builtin.assert:
    that:
      - "'mihomo.service' not in ansible_facts.services"
      - "'clash.service' not in ansible_facts.services"
      - "'clash-meta.service' not in ansible_facts.services"
      - "'vps-mihomo.service' not in ansible_facts.services"
      - "'vps-network.service' not in ansible_facts.services"
      - "ansible_facts.services.get('caddy.service', {}).get('state', '') != 'running'"
    fail_msg: >-
      Existing proxy/project services or a running Caddy were found. This is
      a fresh-host installer, not an upgrade or adoption workflow. Review the
      existing installation separately; do not delete it to bypass this gate.

- name: Inspect project trees without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop:
    - /etc/vps-network
    - /usr/local/lib/vps-network
    - /srv/vps-network
    - /var/lib/vps-mihomo
    - /var/lib/vps-usage
    - /run/vps-mihomo
    - /run/vps-network
    - /run/vps-guard
    - /run/vps-tcpfp-windows
    - /run/vps-tcpfp-ios
    - /etc/systemd/system/caddy.service
    - /etc/systemd/system/caddy.service.d
  register: project_trees

- name: Require unused project trees
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: A project tree already exists. Stop and audit it before any migration.
  loop: "{{ project_trees.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Look for pre-existing project service users
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
    fail_key: false
  loop: [vps-mihomo, vps-usage]
  register: project_users

- name: Refuse to adopt existing project service users
  ansible.builtin.assert:
    that: item.ansible_facts.getent_passwd[item.item] is none
    fail_msg: A project service account already exists; inspect its ownership and access first.
  loop: "{{ project_users.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Look for pre-existing project privilege groups
  ansible.builtin.getent:
    database: group
    key: "{{ item }}"
    fail_key: false
  loop: [vps-mihomo, vps-usage, vps-controller, vps-tls]
  register: project_groups

- name: Refuse to adopt groups whose existing members have not been reviewed
  ansible.builtin.assert:
    that: item.ansible_facts.getent_group[item.item] is none
    fail_msg: A project privilege group already exists; unknown membership must not gain secret access.
  loop: "{{ project_groups.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect every destination before packages or files can change
  ansible.builtin.stat:
    path: "{{ item.target }}"
    follow: false
    get_checksum: false
  loop: "{{ deployment.files }}"
  register: destination_status
  no_log: true

- name: Refuse to overwrite existing destination files or links
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: A deployment destination already exists; adoption is not supported.
  loop: "{{ destination_status.results }}"
  no_log: true

- name: Inspect existing destination ancestors
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: >-
    {{ (deployment.directories | map(attribute='path') | list +
        ['/etc', '/etc/systemd', '/etc/systemd/system', '/etc/sysctl.d',
         '/usr', '/usr/local', '/usr/local/lib', '/srv', '/var', '/var/lib']) | unique }}
  register: ancestor_status
  no_log: true

- name: Refuse symlinked or non-directory destination ancestors
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not (item.stat.islnk | default(false))
    fail_msg: A deployment ancestor is a symlink or non-directory.
  loop: "{{ ancestor_status.results }}"
  no_log: true
