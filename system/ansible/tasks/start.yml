---
- name: Load the validated units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Apply the explicitly requested host BBR settings
  ansible.builtin.command:
    argv: [sysctl, --load, /etc/sysctl.d/80-vps-network-bbr.conf]
  when: deployment.bbr_host | default(false)
  changed_when: true

- name: Start dedicated namespaces before their backend services
  ansible.builtin.systemd_service:
    name: vps-network.service
    enabled: true
    state: started
  when: deployment.tcpfp_enabled

- name: Start only the enabled TCP fingerprint backends
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ deployment.services | select('match', '^vps-tcpfp-(windows|ios)\\.service$') | list }}"

- name: Install the dedicated guard before allowing the public proxy to start
  ansible.builtin.systemd_service:
    name: vps-guard.service
    enabled: true
    state: started

- name: Start the front-end proxy after backend and guard success
  ansible.builtin.systemd_service:
    name: vps-mihomo.service
    enabled: true
    state: started

- name: Start the private collector, subscription server and certificate timer if requested
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ deployment.services | intersect(['vps-usage.service', 'caddy.service', 'vps-cert-check.timer']) }}"

- name: Confirm enabled units have reached systemd active state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}"]
  loop: "{{ deployment.services | reject('equalto', 'vps-cert-check.service') | list }}"
  changed_when: false

- name: Report the boundary of the automated installation
  ansible.builtin.debug:
    msg: >-
      Installation completed and selected units are active. This does not
      verify public reachability, client authentication, TCP fingerprints,
      UDP behavior, certificate renewal, or reboot recovery. Run the staged
      acceptance checks in docs/deployment.md before moving any clients.
